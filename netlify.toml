[build]
  command = "echo \"No build step\""
  publish = "."

[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hero-bg.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Internal product/design notes: keep out of the public site
[[redirects]]
  from = "/PRODUCT.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/software/DESIGN.md"
  to = "/404"
  status = 404
  force = true
